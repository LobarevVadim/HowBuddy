databases:
  - name: howbuddy-demo-db
    databaseName: howbuddy
    user: howbuddy
    plan: free
    ipAllowList: []

services:
  - type: web
    name: howbuddy-demo-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: howbuddy-demo-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
