name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: support_admin
      - run: flutter analyze
      - run: flutter test
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: howbuddy_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: howbuddy_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          HOWBUDDY_TEST_DATABASE_URL: postgres://howbuddy_test:test_only@127.0.0.1:5432/howbuddy_test
