name: hello
description: "HowBuddy — Your Friendly Guide to How Your Body Works"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  google_mobile_ads: ^9.1.0
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/cropped_how_buddy_1024.png
  android: true
  adaptive_icon_background: '#FFF3E8'
  adaptive_icon_foreground: assets/icon/cropped_how_buddy_1024.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/cropped_how_buddy_1024.png
    background_color: '#FFF8F2'
    theme_color: '#B6753A'
  windows:
    generate: true
    image_path: assets/icon/cropped_how_buddy_1024.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/cropped_how_buddy_1024.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/how_buddy.svg
    - assets/icon/cropped_how_buddy.svg
    - assets/icon/cropped_how_buddy_1024.png
    - assets/avatar/glasses/
