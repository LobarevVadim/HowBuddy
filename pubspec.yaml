name: hello
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/howbuddy_logo.png
  android: true
  adaptive_icon_background: '#FFF3E8'
  adaptive_icon_foreground: assets/icon/howbuddy_logo.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/howbuddy_logo.png
    background_color: '#FFF8F2'
    theme_color: '#B6753A'
  windows:
    generate: true
    image_path: assets/icon/howbuddy_logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/howbuddy_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/howbuddy_loading.jpg
    - assets/images/howbuddy_mascot.jpg
